services:
  - type: web
    name: upsa-claims-api
    runtime: node
    buildCommand: npm ci && npm run db:generate && npm run build:api
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
